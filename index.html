<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Reading Test 2 – The Pen and the Keyboard</title>
<style>
:root{--bg:#f4ecd8;--paper:#fbf6e9;--panel:#efe5cc;--card:#fffdf6;--ink:#1f2433;--accent:#1f2a44;--onaccent:#fff;--accent2:#d9472b;--onaccent2:#fff;--soft:#e9dfc5;--hl:#ffe066;--evbg:#fde2dc;--head:#1f2a44;--headink:#f4ecd8;--introbg:linear-gradient(160deg,#243256,#0d1424);--introink:#f4ecd8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- INTRO ---------- */
#intro{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--introbg);color:var(--introink);text-align:center;overflow:hidden;position:relative}
#intro .scene{width:min(720px,96vw);margin-bottom:10px}
#intro .scene svg{width:100%;height:auto;display:block}
.kicker{letter-spacing:.25em;text-transform:uppercase;font-size:14px;opacity:.85;animation:fadeUp 1s .3s both}
#intro h1{font-size:clamp(30px,5vw,50px);line-height:1.15;margin:6px 0 8px;animation:fadeUp 1s .6s both}
.sub{font-size:19px;opacity:.9;max-width:640px;animation:fadeUp 1s .9s both}
.startbox{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:fadeUp 1s 1.2s both}
.startbox input{font-size:19px;padding:12px 16px;border-radius:12px;border:2px solid var(--accent2);min-width:260px;background:#fff;color:#222}
.btn{font-size:18px;padding:12px 22px;border-radius:12px;border:none;background:var(--accent);color:var(--onaccent);font-weight:700;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn.alt{background:var(--accent2);color:var(--onaccent2)}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit}
.info{margin-top:18px;font-size:16px;opacity:.85;animation:fadeUp 1s 1.5s both}
.info span{display:inline-block;margin:4px 8px;padding:4px 12px;border-radius:20px;background:rgba(255,255,255,.15)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ---------- TEST ---------- */
header{position:sticky;top:0;z-index:20;background:var(--head);color:var(--headink);display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.18)}
header .ttl{font-weight:800;font-size:19px;flex:1;min-width:200px}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;padding:4px 14px;border-radius:10px;background:rgba(255,255,255,.15)}
.timer.low{background:#c62828;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
header .hb{font-size:15px;padding:8px 14px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:transparent;color:inherit;font-weight:600}
header .hb.on{background:var(--hl);color:#222;border-color:var(--hl)}
header .hb.submit{background:var(--accent2);color:var(--onaccent2);border-color:var(--accent2)}
.progress{height:6px;background:rgba(0,0,0,.1)}
.progress div{height:100%;width:0;background:var(--accent2);transition:width .5s}
.tabs{display:none;gap:8px;padding:8px 12px;background:var(--panel)}
.tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--ink);font-weight:700;font-size:16px}
.tabs button.on{background:var(--accent);color:var(--onaccent)}
main{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 66px)}
.pane{overflow-y:auto;padding:26px 30px 60px}
#passage{background:var(--paper);border-right:4px solid var(--soft)}
#passage h2{font-size:26px;margin-bottom:6px;color:var(--accent)}
#passage .note{font-size:15px;opacity:.75;margin-bottom:16px}
#passage p{margin-bottom:16px;text-align:justify;line-height:1.75;font-size:18.5px}
#passage p b.pl{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-size:15px;margin-right:8px}
mark.hl{background:var(--hl);border-radius:3px;cursor:pointer;padding:0 1px}
.ev{background:var(--evbg);outline:2px solid var(--accent2);border-radius:4px;animation:flash 1.2s 2}
@keyframes flash{50%{background:transparent}}
.g{border-bottom:2px dotted var(--accent2);position:relative;cursor:help}
.g:hover::after,.g:focus::after{content:attr(data-ar);position:absolute;bottom:125%;left:50%;transform:translateX(-50%);background:var(--head);color:var(--headink);padding:6px 12px;border-radius:8px;font-size:18px;white-space:nowrap;z-index:5;direction:rtl;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#questions{background:var(--panel)}
.group{background:var(--card);border-radius:16px;padding:20px 22px;margin-bottom:22px;box-shadow:0 3px 14px rgba(0,0,0,.07);border-top:5px solid var(--accent);animation:fadeUp .6s both}
.group h3{font-size:20px;color:var(--accent);margin-bottom:6px}
.group .ins{font-size:16px;margin-bottom:12px;opacity:.9}
.group .extra{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:16.5px}
.group .extra .xt{font-weight:800;margin-bottom:4px}
.group .extra table{width:100%;border-collapse:collapse}
.group .extra td{padding:6px 8px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55)}
.q{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed rgba(0,0,0,.1)}
.q:last-child{border-bottom:none}
.qn{flex:0 0 34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;transition:background .3s,color .3s}
.q.done .qn{background:var(--accent);color:var(--onaccent);animation:pop .35s}
.qb{flex:1}
.qb .stem{margin-bottom:6px}
select,input.gap{font-size:17px;padding:6px 10px;border-radius:8px;border:2px solid var(--soft);background:#fff;color:#222}
select:focus,input.gap:focus{outline:none;border-color:var(--accent2)}
input.gap{width:170px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:10px;cursor:pointer;transition:background .2s}
.opts label:hover{background:var(--soft)}
.opts input{margin-top:6px;transform:scale(1.25);accent-color:var(--accent)}
.summary{background:var(--soft);padding:16px 18px;border-radius:12px;line-height:2.4}
.summary .st{font-weight:800;text-align:center;margin-bottom:4px;line-height:1.5}
.summary .sn{font-weight:800;color:var(--accent)}
.summary input.gap,.summary select{margin:0 4px}
.flow .fbox{background:var(--soft);border:2px solid var(--accent);border-radius:12px;padding:12px 16px;line-height:2.2}
.flow .arrow{text-align:center;font-size:26px;color:var(--accent);line-height:1.2;animation:bob 1.6s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.flow .ft{font-weight:800;text-align:center;margin-bottom:8px}
footer{text-align:center;font-size:14px;opacity:.7;padding:20px}

/* ---------- RESULTS ---------- */
#results{max-width:980px;margin:0 auto;padding:30px 20px 60px}
.scorecard{background:var(--introbg);color:var(--introink);border-radius:22px;padding:30px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.18);animation:pop .6s both}
.ring{width:170px;height:170px;margin:0 auto 10px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:900}
.ring .num small{font-size:15px;font-weight:600;opacity:.85}
.band{font-size:22px;font-weight:800;margin-top:6px}
.band small{display:block;font-size:14px;font-weight:400;opacity:.8}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.breakdown{background:var(--card);border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 3px 14px rgba(0,0,0,.07)}
.breakdown h3,.review h3{color:var(--accent);margin-bottom:12px}
.bar{margin-bottom:12px}
.bar .lab{display:flex;justify-content:space-between;font-size:16px;font-weight:600}
.bar .track{height:14px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;width:0;background:var(--accent2);border-radius:8px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.review{background:var(--card);border-radius:18px;padding:22px;margin-top:24px;box-shadow:0 3px 14px rgba(0,0,0,.07)}
.ri{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed rgba(0,0,0,.12);animation:fadeUp .5s both}
.ri .qn{flex:0 0 36px}
.ri.ok .qn{background:#2e7d32;color:#fff}
.ri.no .qn{background:#c62828;color:#fff}
.ri .why{font-size:15.5px;opacity:.85;margin-top:3px}
.ri .yours{font-size:15.5px}
.ri button{margin-top:6px;font-size:14px;padding:5px 12px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}
#reviewPassage{position:fixed;right:0;top:0;bottom:0;width:min(560px,100vw);background:var(--paper);box-shadow:-10px 0 30px rgba(0,0,0,.25);z-index:50;overflow-y:auto;padding:24px 28px;transform:translateX(105%);transition:transform .4s}
#reviewPassage.open{transform:none}
#reviewPassage p{margin-bottom:14px;line-height:1.7}
#reviewPassage .close{position:sticky;top:0;float:right}

/* ---------- MODAL / CERT ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:var(--card);color:var(--ink);border-radius:18px;padding:26px;max-width:460px;text-align:center;animation:pop .4s both}
.modal .box h3{margin-bottom:8px;color:var(--accent)}
.modal .box p{margin-bottom:16px}
#cert{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.certpaper{background:#fffdf7;color:#222;width:min(860px,96vw);aspect-ratio:1.414;border:14px solid var(--accent);outline:4px solid var(--accent2);outline-offset:-26px;padding:6% 8%;text-align:center;display:flex;flex-direction:column;justify-content:center;position:relative;animation:pop .6s both}
.certpaper h2{font-size:clamp(24px,4vw,44px);color:var(--accent);letter-spacing:.06em}
.certpaper .nm{font-size:clamp(26px,4.5vw,46px);font-weight:800;margin:14px 0;border-bottom:3px solid var(--accent2);display:inline-block;padding:0 20px}
.certpaper .sm{font-size:clamp(14px,1.8vw,19px)}
.certpaper .by{position:absolute;bottom:7%;left:0;right:0;font-size:14px;opacity:.75}
.certbtns{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:71}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}

@media (max-width:820px){
 main{grid-template-columns:1fr;height:auto}
 .tabs{display:flex}
 .pane{padding:18px 16px 40px}
 #passage{border-right:none}
 main.showQ #passage{display:none}
 main:not(.showQ) #questions{display:none}
}
@media print{
 body *{visibility:hidden}
 #cert,#cert *{visibility:visible}
 #cert{position:absolute;inset:0;background:#fff}
 .certbtns{display:none}
}
</style>

<script>
const DATA = {"id": "ielts-reading-test2", "testNo": "Test 2", "title": "The Pen and the Keyboard", "certTitle": "Thoughtful Reader", "paragraphs": [["A", "For most of the past two centuries, learning to write by hand was one of the central tasks of schooling. Children spent hours copying letters into lined exercise books, first as separate printed characters and later in cursive, or 'joined-up', script, in which the letters of a word are connected in a continuous line. Teachers often devoted entire lessons to posture, the correct way to hold a pen and the precise angle at which letters should slope. Good handwriting was regarded not merely as a practical skill but as a sign of discipline and character, and in many countries pupils were graded on the neatness of their work as well as its content."], ["B", "The arrival of computers, and later of tablets and smartphones, has steadily weakened that tradition. Adults now type far more than they write, and many schools have reduced the time devoted to handwriting in favour of keyboard skills. In 2016 Finland, whose education system is widely admired, made cursive writing optional, arguing that fluent typing was a more useful skill for modern life. In the United States, national curriculum standards introduced in 2010 did not require cursive at all, and within a decade many children were leaving primary school unable to read joined-up script, let alone produce it. Some commentators predicted that handwriting would soon become as rare as calligraphy, practised by enthusiasts but no longer needed by ordinary people."], ["C", "For a time, the decline seemed both inevitable and harmless. Over the past fifteen years, however, a growing body of research has suggested that the movements of the hand may play a more important role in learning than was once assumed. The psychologist Karin James at Indiana University used brain scanning to study young children who had not yet learned to read. After practising letters by writing them freehand, the children showed greater activity in brain areas associated with reading than those who had practised by typing or by tracing over letters. James concluded that the effort of forming each letter, with all the small imperfections this involves, helps children learn to recognise letters in their many different shapes."], ["D", "Similar effects have been reported among older students. In a widely cited 2014 study, Pam Mueller and Daniel Oppenheimer found that university students who took lecture notes by hand performed better on conceptual questions than those who used laptops. Because handwriting is slower, they argued, students are forced to summarise and rephrase, whereas typists tend to copy the lecturer's words without processing them. In other words, the slowness of the pen, usually seen as its main weakness, may in fact be its greatest strength. More recently, Audrey van der Meer and colleagues in Norway recorded the brain activity of young adults and found that handwriting produced more widespread patterns of connection than typing — patterns that are thought to support memory."], ["E", "Not all of these findings have proved as robust as the headlines suggested. When other researchers repeated the note-taking experiment, the advantage of handwriting was much smaller and, in some conditions, disappeared altogether. Critics also point out that brain-activity studies show differences in what the brain is doing, not necessarily differences in how much students eventually learn. Moreover, keyboards offer clear benefits: typed work can be edited easily, shared instantly and read without difficulty, and for students who find writing physically difficult, typing can remove a significant barrier to expressing their ideas."], ["F", "As a result, many educators now argue that the question is not which tool should win, but what each is best for. Handwriting may be most valuable when children are first learning letters and when students need to think deeply about new material; typing may be more appropriate for drafting long assignments and for collaborative work. Some recommend a balanced approach, in which younger pupils write by hand for most tasks and move gradually to keyboards as they grow older. Several education systems have already responded: a number of American states, including California in 2023, have passed laws restoring cursive instruction in primary schools. The pen, it seems, is not finished yet."]], "glossary": [["discipline", "انضباط"], ["inevitable", "حتمي / لا مفرّ منه"], ["cursive", "الخط المتّصل"], ["freehand", "باليد الحرّة"], ["conceptual", "مفاهيمي"], ["rephrase", "يعيد الصياغة"], ["robust", "قوي / متين"], ["barrier", "عائق"], ["collaborative", "تعاوني"], ["restoring", "إعادة / استعادة"]], "groups": [{"title": "Questions 1–6", "label": "Matching headings", "kind": "select", "options": ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii", "ix"], "ins": "The passage has six paragraphs, <b>A–F</b>. Choose the correct heading for each paragraph from the list below. There are more headings than paragraphs.", "extra": "<div class='xt'>List of Headings</div>i. A compromise rather than a contest<br>ii. The financial burden of teaching handwriting<br>iii. What early writing does to the developing brain<br>iv. More than a practical skill<br>v. Findings that may have been overstated<br>vi. Pupils' preference for digital devices<br>vii. A gradual shift in priorities<br>viii. Why slower can be better<br>ix. Reviving a forgotten teaching method", "items": [{"n": 1, "text": "Paragraph A", "answer": ["iv"], "ev": "Good handwriting was regarded not merely as a practical skill but as a sign of discipline and character", "why": "Handwriting was valued ‘not merely as a practical skill’ but as a sign of character."}, {"n": 2, "text": "Paragraph B", "answer": ["vii"], "ev": "many schools have reduced the time devoted to handwriting in favour of keyboard skills", "why": "Schools gradually moved their priorities from handwriting to typing."}, {"n": 3, "text": "Paragraph C", "answer": ["iii"], "ev": "study young children who had not yet learned to read", "why": "Brain scans of young children who were learning letters."}, {"n": 4, "text": "Paragraph D", "answer": ["viii"], "ev": "the slowness of the pen, usually seen as its main weakness, may in fact be its greatest strength", "why": "Slowness forces students to summarise — slower can be better."}, {"n": 5, "text": "Paragraph E", "answer": ["v"], "ev": "Not all of these findings have proved as robust as the headlines suggested", "why": "The findings were ‘not as robust as the headlines suggested’ = overstated."}, {"n": 6, "text": "Paragraph F", "answer": ["i"], "ev": "the question is not which tool should win, but what each is best for", "why": "Not a contest (‘which tool should win’) but a role for each. Heading ix is a trap: cursive is being restored, not a new method."}]}, {"title": "Questions 7–10", "label": "Multiple choice", "kind": "radio", "ins": "Choose the correct letter, <b>A, B, C or D</b>.", "items": [{"n": 7, "text": "What point does the writer make about handwriting in the past?", "options": ["A. It was seen as a reflection of personal qualities.", "B. It was taught only in the final years of school.", "C. Teachers considered it less important than what pupils wrote.", "D. It was mainly used for official documents."], "answer": ["A"], "ev": "a sign of discipline and character", "why": "‘Discipline and character’ = personal qualities. C is a trap: pupils were graded on neatness AS WELL AS content."}, {"n": 8, "text": "What does the writer suggest about the US curriculum standards introduced in 2010?", "options": ["A. They were modelled on Finland's approach.", "B. They required typing to be taught from an early age.", "C. They had an unintended effect on children's ability to read joined-up writing.", "D. They were introduced in response to research on handwriting."], "answer": ["C"], "ev": "within a decade many children were leaving primary school unable to read joined-up script", "why": "Cursive was not required, so many children could not read it — a result nobody planned."}, {"n": 9, "text": "How does Karin James explain the results of her study?", "options": ["A. The children who wrote freehand had more time to practise.", "B. Tracing letters is more tiring for young children than typing them.", "C. Typing prevents children from seeing the shapes of letters clearly.", "D. Producing imperfect letters helps children identify letters in varied forms."], "answer": ["D"], "ev": "the effort of forming each letter, with all the small imperfections this involves, helps children learn to recognise letters in their many different shapes", "why": "Imperfections = imperfect letters; ‘many different shapes’ = varied forms."}, {"n": 10, "text": "What is the writer's main purpose in paragraph E?", "options": ["A. to argue that typing is a better tool for learning than handwriting", "B. to show that the case for handwriting is less conclusive than reported", "C. to criticise the equipment used in brain-scanning studies", "D. to explain why students with physical difficulties prefer keyboards"], "answer": ["B"], "ev": "Not all of these findings have proved as robust as the headlines suggested", "why": "The paragraph qualifies earlier claims. It lists benefits of keyboards but never says typing is better (A)."}]}, {"title": "Questions 11–14", "label": "Summary completion (word box)", "kind": "summary", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "ins": "Complete the summary using the list of words, <b>A–H</b>, below. Choose the correct letter. There are more words than gaps.", "extra": "<table><tr><td><b>A</b> speed</td><td><b>B</b> consistent</td><td><b>C</b> understanding</td><td><b>D</b> summarising</td></tr><tr><td><b>E</b> recall</td><td><b>F</b> mixed</td><td><b>G</b> copying</td><td><b>H</b> accuracy</td></tr></table>", "stitle": "Research on older learners", "text": "Mueller and Oppenheimer found that students who took notes by hand were better at questions that required {11} rather than simple recall. They argued that the pen's lack of {12} is actually an advantage, since it stops students from {13} what a lecturer says word for word. However, later attempts to repeat the study produced {14} results, with the benefit of handwriting reduced or absent in some cases.", "items": [{"n": 11, "answer": ["C"], "ev": "performed better on conceptual questions", "why": "C (understanding): conceptual questions test understanding, not recall."}, {"n": 12, "answer": ["A"], "ev": "Because handwriting is slower", "why": "A (speed): handwriting is slower = the pen lacks speed."}, {"n": 13, "answer": ["G"], "ev": "typists tend to copy the lecturer's words without processing them", "why": "G (copying): ‘word for word’ = copying. D (summarising) is the trap — that is what handwriters do."}, {"n": 14, "answer": ["F"], "ev": "the advantage of handwriting was much smaller and, in some conditions, disappeared altogether", "why": "F (mixed): smaller in some cases, gone in others."}]}], "confetti": ["#d9472b", "#f4ecd8", "#e8b04a", "#6c86c4"]};
const TOTAL = 20*60;
let state = {name:"", answers:{}, timeLeft:TOTAL, submitted:false};
let tick=null, paused=false, hlMode=false;
const $ = s=>document.querySelector(s);

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function norm(s){return String(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[.,;:!?"]/g,"").replace(/\s+/g," ").trim()}
function applyGloss(html){
  const used=new Set();
  return html.split(/(<[^>]+>)/).map(seg=>{
    if(seg.startsWith("<")) return seg;
    DATA.glossary.forEach(([w,ar])=>{
      if(used.has(w)) return;
      const re=new RegExp("\\b("+w.replace(/[-]/g,"\\-")+")\\b","i");
      if(re.test(seg)){ seg=seg.replace(re,`<span class="g" tabindex="0" data-ar="${ar}">$1</span>`); used.add(w); }
    });
    return seg;
  }).join("");
}
function passageHTML(evSnippet){
  let out=`<h2>${esc(DATA.title)}</h2><div class="note">Read the passage and answer Questions 1–14. Hover over or tap a dotted word to see its Arabic meaning.</div>`;
  DATA.paragraphs.forEach(([L,t])=>{
    let h=esc(t);
    if(evSnippet){const e=esc(evSnippet); if(h.includes(e)) h=h.replace(e,`<span class="ev" id="evHit">${e}</span>`);}
    out+=`<p data-p="${L}"><b class="pl">${L}</b>${applyGloss(h)}</p>`;
  });
  return out;
}

/* ---------- build questions ---------- */
function allItems(){const a=[];DATA.groups.forEach(g=>g.items.forEach(i=>a.push(Object.assign({group:g},i))));return a}
function optSelect(n,opts){return `<select data-n="${n}"><option value="">–</option>${opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`}
function buildQuestions(){
  let h="";
  DATA.groups.forEach((g,gi)=>{
    h+=`<div class="group" style="animation-delay:${gi*.12}s"><h3>${g.title}</h3><div class="ins">${g.ins}</div>`;
    if(g.extra) h+=`<div class="extra">${g.extra}</div>`;
    if(g.kind==="summary"){
      h+=`<div class="summary">${g.stitle?`<div class="st">${g.stitle}</div>`:""}${g.text.replace(/\{(\d+)\}/g,(m,n)=>`<span class="sn">(${n})</span>`+(g.options?optSelect(n,g.options):`<input class="gap" data-n="${n}" autocomplete="off">`))}</div>`;
    } else if(g.kind==="flow"){
      h+=`<div class="flow">${g.stitle?`<div class="ft">${g.stitle}</div>`:""}`+g.boxes.map((b,bi)=>(bi?`<div class="arrow">⬇</div>`:"")+`<div class="fbox">${b.replace(/\{(\d+)\}/g,(m,n)=>`<span class="sn"><b>(${n})</b></span> <input class="gap" data-n="${n}" autocomplete="off">`)}</div>`).join("")+`</div>`;
    } else {
      g.items.forEach(it=>{
        h+=`<div class="q" id="q${it.n}"><div class="qn">${it.n}</div><div class="qb"><div class="stem">${it.text}</div>`;
        if(g.kind==="radio"){
          const opts=it.options||g.options;
          h+=`<div class="opts">${opts.map(o=>{const v=/^[A-H]\.\s/.test(o)?o[0]:o;return `<label><input type="radio" name="r${it.n}" data-n="${it.n}" value="${esc(v)}"><span>${esc(o)}</span></label>`}).join("")}</div>`;
        } else if(g.kind==="select"){
          h+=optSelect(it.n,g.options);
        } else {
          h+=`<input class="gap" data-n="${it.n}" autocomplete="off">`;
        }
        h+=`</div></div>`;
      });
    }
    h+=`</div>`;
  });
  h+=`<footer>Designed by: Nazila Motahari</footer>`;
  $("#questions").innerHTML=h;
  $("#questions").querySelectorAll("[data-n]").forEach(el=>{
    el.addEventListener(el.tagName==="INPUT"&&el.type!=="radio"?"input":"change",()=>{
      state.answers[el.dataset.n]=el.value; markDone(el.dataset.n); updateProg();
    });
  });
}
function markDone(n){const q=$("#q"+n); if(q) q.classList.toggle("done",!!(state.answers[n]||"").trim());}
function updateProg(){const c=Object.values(state.answers).filter(v=>(v||"").trim()).length;$("#prog").style.width=(c/14*100)+"%"}
function restoreAnswers(){
  Object.entries(state.answers).forEach(([n,v])=>{
    document.querySelectorAll(`[data-n="${n}"]`).forEach(el=>{
      if(el.type==="radio") el.checked=(el.value===v); else el.value=v;
    });
    markDone(n);
  });
  updateProg();
}

/* ---------- timer ---------- */
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(){
  clearInterval(tick);
  tick=setInterval(()=>{
    if(paused||state.submitted) return;
    state.timeLeft--; $("#timer").textContent=fmt(state.timeLeft);
    $("#timer").classList.toggle("low",state.timeLeft<=120);
    if(state.timeLeft<=0){clearInterval(tick); modal("⏰ Time is up!","In the real exam you would stop now. Submit your answers to see your score.",[["Submit now",submit]]);}
  },1000);
}

/* ---------- highlighter ---------- */
document.addEventListener("mouseup",()=>{
  if(!hlMode) return;
  const sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed) return;
  const r=sel.getRangeAt(0);
  if(!$("#passage").contains(r.commonAncestorContainer)) return;
  try{const m=document.createElement("mark");m.className="hl";m.appendChild(r.extractContents());r.insertNode(m);}catch(e){}
  sel.removeAllRanges();
});
document.addEventListener("click",e=>{
  if(e.target.matches("mark.hl")){const m=e.target;m.replaceWith(...m.childNodes);}
});

/* ---------- save / load ---------- */
function save(){
  const blob=new Blob([JSON.stringify({app:DATA.id,name:state.name,answers:state.answers,timeLeft:state.timeLeft,saved:new Date().toISOString()},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`${DATA.id}-${(state.name||"student").replace(/\s+/g,"_")}.json`;a.click();
  modal("💾 Saved","Your answers and remaining time were downloaded as a file. Use “Load” to continue later.",[["OK",null]]);
}
$("#fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    if(d.app!==DATA.id){modal("Wrong file","This save file belongs to a different test.",[["OK",null]]);return;}
    state.name=d.name||state.name; state.answers=d.answers||{}; state.timeLeft=d.timeLeft||TOTAL;
    if($("#test").classList.contains("hidden")) begin(); else restoreAnswers();
    $("#timer").textContent=fmt(state.timeLeft);
    modal("📂 Loaded","Welcome back"+(state.name?", "+esc(state.name):"")+"! Your answers have been restored.",[["Continue",null]]);
  }catch(err){modal("Error","That file could not be read.",[["OK",null]]);}};
  rd.readAsText(f); e.target.value="";
});

/* ---------- modal ---------- */
function modal(title,text,btns){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><h3>${title}</h3><p>${text}</p><div class="rbtns"></div></div>`;
  btns.forEach(([l,fn],i)=>{const b=document.createElement("button");b.className="btn"+(i?" ghost":"");b.textContent=l;b.onclick=()=>{m.remove();fn&&fn()};m.querySelector(".rbtns").appendChild(b)});
  document.body.appendChild(m);
}

/* ---------- flow ---------- */
function begin(){
  state.name=state.name||$("#nameIn").value.trim();
  $("#intro").classList.add("hidden");$("#test").classList.remove("hidden");
  $("#passage").innerHTML=passageHTML();
  buildQuestions();restoreAnswers();
  $("#timer").textContent=fmt(state.timeLeft);startTimer();
}
$("#startBtn").onclick=begin;
$("#loadBtn0").onclick=()=>$("#fileIn").click();
$("#loadBtn").onclick=()=>$("#fileIn").click();
$("#saveBtn").onclick=save;
$("#hlBtn").onclick=()=>{hlMode=!hlMode;$("#hlBtn").classList.toggle("on",hlMode)};
$("#pauseBtn").onclick=()=>{paused=!paused;$("#pauseBtn").textContent=paused?"▶ Resume":"⏸ Pause";$("#main").style.filter=paused?"blur(7px)":"";};
$("#tabP").onclick=()=>{$("#main").classList.remove("showQ");$("#tabP").classList.add("on");$("#tabQ").classList.remove("on")};
$("#tabQ").onclick=()=>{$("#main").classList.add("showQ");$("#tabQ").classList.add("on");$("#tabP").classList.remove("on")};
$("#submitBtn").onclick=()=>{
  const left=14-Object.values(state.answers).filter(v=>(v||"").trim()).length;
  modal("Submit your answers?",left?`You still have <b>${left}</b> unanswered question${left>1?"s":""}. In IELTS, a guess is better than a blank!`:"You have answered every question.",[["Submit",submit],["Keep working",null]]);
};

/* ---------- marking ---------- */
function isRight(it){const v=norm(state.answers[it.n]);return it.answer.some(a=>norm(a)===v)}
function band(s){return s>=14?"8.5–9":s>=13?"8":s>=12?"7.5":s>=11?"7":s>=10?"6.5":s>=9?"6":s>=7?"5.5":s>=5?"5":"4.5 or below"}
function submit(){
  state.submitted=true;clearInterval(tick);
  const items=allItems();const score=items.filter(isRight).length;
  const pct=Math.round(score/14*100);
  $("#test").classList.add("hidden");$("#resultsWrap").classList.remove("hidden");window.scrollTo(0,0);
  const C=2*Math.PI*70;
  let h=`<div class="scorecard"><div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="70" stroke="rgba(255,255,255,.2)" stroke-width="14" fill="none"/><circle id="arc" cx="85" cy="85" r="70" stroke="var(--accent2)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1)"/></svg><div class="num"><span id="cnt">0</span><small>out of 14</small></div></div>
  <div style="font-size:20px">${state.name?esc(state.name)+" — ":""}${pct}% correct</div>
  <div class="band">Approximate band: ${band(score)}<small>Estimated from one passage only; a real test has three passages and 40 questions.</small></div>
  <div class="rbtns">${pct>=80?`<button class="btn alt" id="certBtn">🏆 View certificate</button>`:""}<button class="btn" id="retryBtn">↻ Try again</button></div>
  ${pct>=80?"":`<p style="margin-top:12px;font-size:16px">Score 12 or more (80%+) to earn your certificate.</p>`}</div>`;
  // breakdown
  h+=`<div class="breakdown"><h3>📊 Your score by question type</h3>`;
  DATA.groups.forEach(g=>{const ok=g.items.filter(isRight).length;h+=`<div class="bar"><div class="lab"><span>${g.label}</span><span>${ok}/${g.items.length}</span></div><div class="track"><div class="fill" data-w="${ok/g.items.length*100}"></div></div></div>`});
  h+=`</div><div class="review"><h3>🔍 Review: answers and evidence</h3>`;
  items.forEach((it,i)=>{
    const ok=isRight(it);const yours=state.answers[it.n]||"(blank)";
    h+=`<div class="ri ${ok?"ok":"no"}" style="animation-delay:${i*.05}s"><div class="qn">${it.n}</div><div><div class="yours">${ok?"✅":"❌"} Your answer: <b>${esc(yours)}</b>${ok?"":` · Correct: <b>${esc(it.answer[0])}</b>`}</div><div class="why">${it.why}</div>${it.ev?`<button data-ev="${esc(it.ev)}">📍 Show in the passage</button>`:""}</div></div>`;
  });
  h+=`</div>`;
  $("#results").innerHTML=h;
  setTimeout(()=>{$("#arc").style.strokeDashoffset=C*(1-score/14);document.querySelectorAll(".fill").forEach(f=>f.style.width=f.dataset.w+"%")},150);
  let c=0;const ci=setInterval(()=>{if(c>=score){clearInterval(ci);return}c++;$("#cnt").textContent=c},1400/Math.max(score,1));
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>showEv(b.dataset.ev));
  $("#retryBtn").onclick=()=>{state={name:state.name,answers:{},timeLeft:TOTAL,submitted:false};$("#resultsWrap").classList.add("hidden");begin()};
  if(pct>=80){$("#certBtn").onclick=cert;confetti();}
}
function showEv(sn){
  const rp=$("#reviewPassage");
  const tmp=document.createElement("textarea");tmp.innerHTML=sn;
  rp.innerHTML=`<button class="btn close" onclick="document.getElementById('reviewPassage').classList.remove('open')">✕ Close</button>`+passageHTML(tmp.value);
  rp.classList.add("open");
  setTimeout(()=>{const e=document.getElementById("evHit");if(e)e.scrollIntoView({behavior:"smooth",block:"center"})},420);
}

/* ---------- certificate ---------- */
function cert(){
  const d=document.createElement("div");d.id="cert";
  const score=allItems().filter(isRight).length;
  d.innerHTML=`<div class="certpaper"><div class="sm">CERTIFICATE OF ACHIEVEMENT</div><h2>${esc(DATA.certTitle)}</h2><div class="sm">This certifies that</div><div><span class="nm">${esc(state.name||"Student")}</span></div><div class="sm">scored <b>${score}/14</b> (${Math.round(score/14*100)}%) on IELTS Academic Reading ${esc(DATA.testNo)}: “${esc(DATA.title)}”</div><div class="sm" style="margin-top:10px">${new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}</div><div class="by">Designed by: Nazila Motahari</div></div>
  <div class="certbtns"><button class="btn alt" onclick="window.print()">🖨 Print / Save as PDF</button><button class="btn" onclick="document.getElementById('cert').remove()">Close</button></div>`;
  document.body.appendChild(d);confetti();
}

/* ---------- confetti ---------- */
function confetti(){
  const cv=$("#confetti");cv.classList.remove("hidden");const x=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=DATA.confetti;const P=[...Array(160)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height,s:6+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)],v:2+Math.random()*4,a:Math.random()*6,w:(Math.random()-.5)*.2}));
  let f=0;(function loop(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.a+=p.w;p.x+=Math.sin(p.a)*1.5;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<260)requestAnimationFrame(loop);else cv.classList.add("hidden")})();
}
</script>
